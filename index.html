<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7c62e8">
  <title>數字合成 10</title>
  <style>
    :root {
      --purple: #7457e8;
      --purple-dark: #533bb7;
      --yellow: #ffd65a;
      --cream: #fffaf0;
      --ink: #343150;
      --green: #35b977;
      --red: #f0646c;
      --shadow: 0 10px 0 rgba(72, 54, 145, .16), 0 16px 30px rgba(72, 54, 145, .16);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 14%, rgba(255,255,255,.72) 0 5%, transparent 5.2%),
        radial-gradient(circle at 89% 18%, rgba(255,224,117,.55) 0 7%, transparent 7.2%),
        linear-gradient(145deg, #e6dcff, #fff4c8 58%, #dff8ee);
      overflow: hidden;
    }

    button { font: inherit; }

    .app {
      width: min(920px, 100%);
      height: 100vh;
      height: 100dvh;
      min-height: 0;
      margin: auto;
      padding: clamp(8px, 2vh, 22px) clamp(14px, 4vw, 34px) clamp(10px, 2vh, 28px);
      display: flex;
      flex-direction: column;
    }

    .app.pk-active {
      width: 100%;
      max-width: none;
      padding-left: clamp(10px, 1.5vw, 24px);
      padding-right: clamp(10px, 1.5vw, 24px);
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: center;
      margin-bottom: clamp(7px, 1.5vh, 18px);
      flex: 0 0 auto;
    }

    .title-wrap { display: flex; align-items: center; gap: 12px; }

    .mascot {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 6px 0 rgba(116,87,232,.18);
      font-size: 34px;
      transform: rotate(-5deg);
    }

    h1 { margin: 0; font-size: clamp(25px, 5vw, 40px); color: var(--purple-dark); }
    .subtitle { margin: 2px 0 0; font-weight: 800; color: #726c86; font-size: clamp(14px, 2.5vw, 18px); }

    .score-pill {
      padding: 10px 15px;
      border: 3px solid #fff;
      border-radius: 999px;
      background: var(--purple);
      color: #fff;
      font-weight: 900;
      font-size: 17px;
      box-shadow: 0 5px 0 rgba(83,59,183,.28);
      white-space: nowrap;
    }

    .top-actions { display: flex; align-items: center; gap: 10px; }
    .top-home-btn {
      padding: 9px 14px;
      border: 3px solid #fff;
      border-radius: 999px;
      background: #fff;
      color: var(--purple-dark);
      font-weight: 950;
      font-size: 17px;
      cursor: pointer;
      box-shadow: 0 5px 0 rgba(83,59,183,.22);
      white-space: nowrap;
    }
    .top-home-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(83,59,183,.22); }

    .panel {
      flex: 1;
      min-height: 0;
      position: relative;
      padding: clamp(10px, 2vh, 24px) clamp(12px, 3vw, 30px);
      border: 5px solid rgba(255,255,255,.9);
      border-radius: 34px;
      background: rgba(255,255,255,.82);
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .status-row {
      display: grid;
      grid-template-columns: minmax(110px, 1fr) auto minmax(110px, 1fr);
      align-items: center;
      gap: 14px;
      margin-bottom: clamp(6px, 1.2vh, 14px);
      flex: 0 0 auto;
    }

    .progress-label, .tries { font-weight: 900; font-size: clamp(15px, 2.7vw, 19px); }
    .tries { text-align: right; color: #d64e61; letter-spacing: 2px; }
    .equation {
      padding: 9px 16px;
      border-radius: 18px;
      background: #fff1a8;
      color: #725300;
      font-size: clamp(19px, 3vw, 25px);
      font-weight: 950;
      box-shadow: inset 0 -4px rgba(255,183,48,.18);
      text-align: center;
      min-width: 132px;
    }
    .equation.empty { visibility: hidden; }

    .progress-track {
      height: 14px;
      border-radius: 999px;
      background: #e9e3ff;
      overflow: hidden;
      margin-bottom: clamp(7px, 1.3vh, 16px);
      flex: 0 0 auto;
    }

    .progress-bar {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #7d63ec, #c674e8);
      transition: width .4s ease;
    }

    .instruction {
      margin: 0 0 clamp(7px, 1.3vh, 16px);
      text-align: center;
      font-size: clamp(19px, 3vw, 25px);
      font-weight: 900;
    }

    .cards {
      width: min(650px, 100%);
      margin: 0 auto;
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, minmax(0, 1fr));
      gap: clamp(7px, 1.5vh, 15px) clamp(9px, 2vw, 16px);
    }

    .card {
      position: relative;
      min-height: 0;
      border: 4px solid #fff;
      border-radius: clamp(18px, 3vw, 27px);
      background: var(--card-color, #ff817c);
      color: #fff;
      font-size: clamp(30px, 6.5vh, 68px);
      font-weight: 950;
      line-height: 1;
      cursor: pointer;
      box-shadow: 0 8px 0 var(--card-shadow, #ce5b5c), 0 12px 20px rgba(55,45,100,.14);
      transition: transform .14s ease, box-shadow .14s ease, filter .14s ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }

    .card::after {
      content: "★";
      position: absolute;
      right: 11px;
      top: 8px;
      color: rgba(255,255,255,.38);
      font-size: clamp(15px, 3vw, 24px);
    }

    .card:hover { transform: translateY(-3px); filter: brightness(1.04); }
    .card:active { transform: translateY(4px); box-shadow: 0 3px 0 var(--card-shadow), 0 6px 10px rgba(55,45,100,.12); }
    .card.selected {
      transform: translateY(-7px) scale(1.04);
      outline: 8px solid #ff243f;
      outline-offset: 3px;
      box-shadow: 0 8px 0 var(--card-shadow), 0 0 0 5px #fff, 0 0 25px rgba(255,36,63,.72);
    }
    .card.correct { animation: correctPulse .7s ease infinite alternate; outline: 7px solid #54dc91; outline-offset: 2px; }
    .card.wrong { animation: shake .42s ease; background: var(--red); }
    .card:disabled { cursor: default; }

    .message {
      min-height: clamp(34px, 5.5vh, 50px);
      margin-top: clamp(6px, 1.2vh, 14px);
      display: grid;
      place-items: center;
      text-align: center;
      font-size: clamp(18px, 3.2vw, 25px);
      font-weight: 950;
      color: var(--purple-dark);
    }

    .next-btn, .confirm-btn, .start-btn, .again-btn {
      border: 0;
      border-radius: 18px;
      background: var(--purple);
      color: white;
      font-weight: 950;
      padding: clamp(9px, 1.5vh, 13px) 25px;
      cursor: pointer;
      box-shadow: 0 6px 0 var(--purple-dark);
    }
    .next-btn { display: none; margin: 2px auto 0; }
    .next-btn.show { display: block; }
    .confirm-btn { display: none; margin: 2px auto clamp(5px, 1vh, 10px); background: var(--green); box-shadow: 0 6px 0 #238653; }
    .confirm-btn.show { display: block; }
    .confirm-btn:disabled { opacity: .45; cursor: not-allowed; filter: grayscale(.2); }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: 12px;
      overflow-y: auto;
      background: rgba(62,47,117,.42);
      backdrop-filter: blur(6px);
    }
    .overlay.hidden { display: none; }
    .modal {
      width: min(510px, 100%);
      max-height: calc(100dvh - 24px);
      overflow-y: auto;
      padding: clamp(18px, 4vh, 34px) 26px;
      border: 5px solid #fff;
      border-radius: 32px;
      background: linear-gradient(145deg, #fffdf5, #f1ebff);
      box-shadow: 0 20px 70px rgba(50,35,110,.35);
      text-align: center;
      animation: pop .42s cubic-bezier(.2,1.5,.45,1);
    }
    .modal-icon { font-size: 76px; }
    .modal h2 { margin: 8px 0; color: var(--purple-dark); font-size: clamp(30px, 7vw, 48px); }
    .modal p { margin: 10px auto 24px; font-size: 18px; line-height: 1.65; font-weight: 700; }
    .start-btn, .again-btn { font-size: 21px; }

    .mode-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 16px;
    }
    .mode-btn {
      min-height: 112px;
      padding: 12px;
      border: 4px solid #fff;
      border-radius: 24px;
      color: #fff;
      font-weight: 950;
      cursor: pointer;
      box-shadow: 0 8px 0 rgba(70,49,143,.3);
      transition: transform .15s ease, filter .15s ease;
    }
    .mode-btn:hover { transform: translateY(-3px); filter: brightness(1.05); }
    .mode-btn:active { transform: translateY(4px); box-shadow: 0 3px 0 rgba(70,49,143,.3); }
    .mode-btn.basic { background: linear-gradient(145deg, #6fcb8e, #39a96d); }
    .mode-btn.advanced { background: linear-gradient(145deg, #9677ef, #694acb); }
    .mode-btn.pk-basic { background: linear-gradient(145deg, #4fb9ed, #247fc5); }
    .mode-btn.pk-advanced { background: linear-gradient(145deg, #ff8a68, #e65565); }
    .mode-btn.pk-game {
      grid-column: 1 / -1;
      min-height: 90px;
      background: linear-gradient(145deg, #ffbd45, #ef7d32);
    }
    .mode-icon { display: block; margin-bottom: 7px; font-size: 42px; }
    .mode-name { display: block; font-size: 24px; }
    .mode-desc { display: block; margin-top: 6px; font-size: 14px; line-height: 1.45; opacity: .95; }
    .finish-actions { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; }
    .home-btn {
      border: 3px solid var(--purple);
      border-radius: 18px;
      background: #fff;
      color: var(--purple-dark);
      font-size: 21px;
      font-weight: 950;
      padding: 11px 25px;
      cursor: pointer;
      box-shadow: 0 6px 0 #d8cff8;
    }

    .hidden { display: none !important; }

    .pk-panel {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 46px minmax(0, 1fr);
      gap: 8px;
      position: relative;
    }
    .pk-player {
      position: relative;
      min-width: 0;
      min-height: 0;
      padding: clamp(8px, 1.5vh, 14px);
      border: 4px solid rgba(255,255,255,.95);
      border-radius: 26px;
      background: rgba(255,255,255,.86);
      box-shadow: 0 8px 0 rgba(72,54,145,.14), 0 12px 24px rgba(72,54,145,.13);
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto auto;
      gap: clamp(5px, 1vh, 9px);
      overflow: hidden;
      transition: filter .45s ease, opacity .45s ease, transform .45s ease;
    }
    .pk-head {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 4px 8px;
      font-weight: 950;
    }
    .pk-name { font-size: clamp(15px, 2vw, 22px); color: var(--purple-dark); }
    .pk-progress { font-size: clamp(13px, 1.7vw, 18px); }
    .pk-tries { grid-column: 1 / -1; color: #d64e61; letter-spacing: 2px; font-size: 15px; }
    .pk-equation {
      min-height: 30px;
      display: grid;
      place-items: center;
      padding: 4px 6px;
      border-radius: 13px;
      background: #fff1a8;
      color: #725300;
      font-weight: 950;
      font-size: clamp(15px, 2vw, 21px);
      text-align: center;
    }
    .pk-equation.empty { visibility: hidden; }
    .pk-equation.game-question {
      min-height: clamp(58px, 11vh, 104px);
      padding: 5px 8px;
      font-size: clamp(30px, 8vw, 84px);
      line-height: 1;
      letter-spacing: .01em;
    }
    .game-question-line {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
    }
    .game-missing {
      width: 1.06em;
      height: 1.06em;
      margin: 0 .07em;
      display: inline-grid;
      place-items: center;
      border: .08em solid #ff3e59;
      border-radius: .14em;
      background: #fff;
      color: #e82e4d;
      line-height: 1;
      box-shadow: 0 .06em 0 rgba(232,46,77,.2), 0 0 .16em rgba(255,62,89,.28);
    }
    .pk-cards {
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-template-rows: repeat(3, minmax(0, 1fr));
      gap: clamp(5px, .9vh, 9px);
    }
    .pk-card {
      position: relative;
      min-width: 0;
      min-height: 0;
      border: 3px solid #fff;
      border-radius: clamp(10px, 1.5vw, 18px);
      background: var(--card-color, #ff817c);
      color: #fff;
      font-size: clamp(25px, 5vh, 52px);
      font-weight: 950;
      line-height: 1;
      cursor: pointer;
      box-shadow: 0 5px 0 var(--card-shadow, #ce5b5c);
      touch-action: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .pk-card.selected {
      z-index: 2;
      outline: 6px solid #ff243f;
      outline-offset: 1px;
      box-shadow: 0 5px 0 var(--card-shadow), 0 0 0 3px #fff, 0 0 16px rgba(255,36,63,.7);
    }
    .pk-card.correct { outline: 6px solid #38d987; animation: correctPulse .55s ease infinite alternate; }
    .pk-card.wrong { animation: shake .4s ease; filter: saturate(.35); }
    .pk-message {
      min-height: 28px;
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--purple-dark);
      font-size: clamp(13px, 1.6vw, 17px);
      font-weight: 950;
    }
    .pk-confirm {
      display: none;
      justify-self: center;
      border: 0;
      border-radius: 13px;
      padding: 7px 16px;
      background: var(--green);
      color: #fff;
      font-weight: 950;
      box-shadow: 0 4px 0 #238653;
      cursor: pointer;
    }
    .pk-confirm.show { display: block; }
    .pk-confirm:disabled { opacity: .45; cursor: not-allowed; }
    .pk-divider { position: relative; display: grid; place-items: center; }
    .pk-divider::before {
      content: "";
      position: absolute;
      top: 2%;
      bottom: 2%;
      left: 50%;
      width: 5px;
      transform: translateX(-50%);
      border-radius: 999px;
      background: linear-gradient(#7557e8, #ff6c75);
    }
    .pk-divider span {
      z-index: 1;
      width: 43px;
      height: 43px;
      display: grid;
      place-items: center;
      border: 4px solid #fff;
      border-radius: 50%;
      background: #ffcf4f;
      color: #6a3c00;
      font-weight: 1000;
      box-shadow: 0 5px 0 rgba(108,67,0,.18);
    }
    .pk-player.loser { filter: brightness(.32) saturate(.35); pointer-events: none; }
    .pk-player.winner { transform: scale(1.015); box-shadow: 0 0 0 7px #ffd54f, 0 0 38px rgba(255,197,50,.8); }
    .pk-winner-card {
      position: absolute;
      inset: 50% auto auto 50%;
      z-index: 8;
      transform: translate(-50%, -50%);
      width: min(88%, 330px);
      padding: 20px 12px;
      border: 5px solid #fff;
      border-radius: 24px;
      background: linear-gradient(145deg, #ffe66f, #ff9a68);
      color: #693a00;
      text-align: center;
      font-size: clamp(25px, 4vw, 42px);
      font-weight: 1000;
      box-shadow: 0 15px 40px rgba(95,52,0,.35);
      animation: winnerPop .9s ease both, winnerGlow 1s ease-in-out .9s infinite alternate;
    }
    .pk-countdown {
      position: absolute;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      background: rgba(48,34,102,.65);
      backdrop-filter: blur(5px);
    }
    .pk-countdown-number {
      width: clamp(140px, 24vw, 230px);
      height: clamp(140px, 24vw, 230px);
      display: grid;
      place-items: center;
      border: 9px solid #fff;
      border-radius: 50%;
      background: linear-gradient(145deg, #8b6df0, #ff7979);
      color: #fff;
      font-size: clamp(72px, 14vw, 130px);
      font-weight: 1000;
      box-shadow: 0 18px 70px rgba(35,20,90,.5);
      animation: countdownPop .9s ease infinite;
    }
    .pk-countdown-number.start {
      width: auto;
      height: auto;
      min-width: min(72vw, 620px);
      padding: clamp(22px, 4vh, 42px) clamp(40px, 8vw, 100px);
      border-color: #ffd4c8;
      border-radius: 34px;
      background: linear-gradient(145deg, #fff8f2, #ffe4d8);
      color: #ff846d;
      font-size: clamp(72px, 12vw, 150px);
      letter-spacing: .12em;
      line-height: 1;
      white-space: nowrap;
      text-indent: .12em;
      box-shadow: 0 18px 70px rgba(255,132,109,.45);
    }
    @keyframes countdownPop { 0% { transform: scale(.72); opacity: .55; } 55% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }

    .celebrate {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      pointer-events: none;
      overflow: hidden;
    }
    .celebrate.hidden { display: none; }
    .cheer {
      padding: 18px 30px;
      border: 5px solid #fff;
      border-radius: 28px;
      background: linear-gradient(135deg, #ffd759, #ff8b79);
      color: #633700;
      font-size: clamp(32px, 8vw, 62px);
      font-weight: 1000;
      box-shadow: 0 14px 45px rgba(90,52,0,.25);
      animation: cheerPop 1.1s ease forwards;
    }
    .confetti {
      position: absolute;
      width: 13px;
      height: 25px;
      border-radius: 4px;
      top: -30px;
      background: var(--c);
      left: var(--x);
      transform: rotate(var(--r));
      animation: fall var(--d) ease-in forwards;
    }

    @keyframes shake { 20%,60% { transform: translateX(-8px); } 40%,80% { transform: translateX(8px); } }
    @keyframes correctPulse { to { transform: translateY(-7px) scale(1.08); filter: brightness(1.08); } }
    @keyframes pop { from { opacity: 0; transform: scale(.75); } }
    @keyframes cheerPop { 0% { opacity: 0; transform: scale(.5) rotate(-5deg); } 35% { opacity: 1; transform: scale(1.1) rotate(3deg); } 70% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1.1); } }
    @keyframes winnerPop { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.5) rotate(-6deg); } 65% { opacity: 1; transform: translate(-50%, -50%) scale(1.1) rotate(2deg); } 100% { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
    @keyframes winnerGlow { to { box-shadow: 0 15px 46px rgba(255,159,28,.75); } }
    @keyframes fall { to { top: 110%; transform: rotate(720deg); } }

    @media (max-width: 560px) {
      .app { padding-top: 8px; padding-bottom: 8px; }
      .mascot { width: 48px; height: 48px; font-size: 28px; }
      .top-actions { flex-direction: column; gap: 6px; }
      .score-pill, .top-home-btn { padding: 7px 10px; font-size: 14px; }
      .subtitle { display: none; }
      .panel { border-radius: 25px; padding: 10px 12px; }
      .status-row { gap: 7px; grid-template-columns: 1fr auto 1fr; }
      .equation { min-width: 105px; padding: 8px; }
      .cards { gap: 10px; }
      .card { min-height: 0; border-width: 3px; box-shadow: 0 6px 0 var(--card-shadow), 0 9px 16px rgba(55,45,100,.13); }
      .mode-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .mode-btn { min-height: 98px; padding: 10px 6px; }
      .mode-btn.pk-game { min-height: 82px; }
      .mode-icon { display: inline-block; margin: 0 8px 0 0; font-size: 30px; vertical-align: middle; }
      .mode-name { display: inline-block; font-size: 18px; vertical-align: middle; }
      .mode-desc { font-size: 12px; }
      .pk-panel { grid-template-columns: minmax(0, 1fr) 28px minmax(0, 1fr); gap: 3px; }
      .pk-player { padding: 6px 4px; border-width: 3px; border-radius: 17px; }
      .pk-name { font-size: 13px; }
      .pk-progress, .pk-tries { font-size: 11px; }
      .pk-card { font-size: clamp(23px, 5vh, 40px); border-radius: 10px; }
      .pk-equation.game-question {
        min-height: 48px;
        padding: 3px;
        font-size: clamp(25px, 8vw, 36px);
      }
      .pk-divider span { width: 30px; height: 30px; border-width: 3px; font-size: 12px; }
    }

    @media (max-height: 700px) {
      .mascot { width: 44px; height: 44px; font-size: 26px; border-radius: 14px; }
      h1 { font-size: 26px; }
      .subtitle { display: none; }
      .score-pill, .top-home-btn { padding: 6px 10px; font-size: 14px; }
      .status-row { margin-bottom: 5px; }
      .equation { padding: 5px 10px; font-size: 18px; }
      .progress-track { height: 10px; margin-bottom: 6px; }
      .instruction { margin-bottom: 6px; font-size: 18px; }
      .card { border-radius: 16px; font-size: clamp(27px, 6vh, 44px); }
      .card::after { right: 7px; top: 5px; font-size: 14px; }
      .message { min-height: 28px; margin-top: 5px; font-size: 17px; }
      .next-btn, .confirm-btn { padding: 7px 20px; }
      .modal-icon { font-size: 48px; }
      .modal h2 { font-size: 30px; }
      .modal p { margin: 6px auto 12px; font-size: 16px; }
      .mode-grid { margin-top: 12px; }
      .mode-btn { min-height: 90px; padding: 10px; }
      .mode-btn.pk-game { min-height: 76px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="app" aria-label="數字合成十遊戲">
    <header class="topbar">
      <div class="title-wrap">
        <div class="mascot" aria-hidden="true">🦊</div>

      <div class="top-actions">
        <div class="score-pill" id="scorePill">⭐ <span id="score">0</span> 分</div>

    <section class="panel" id="singlePanel">
      <div class="status-row">
        <div class="progress-label">第 <span id="questionNo">1</span>／15 題</div>

      <div class="message" id="message" role="status" aria-live="polite">先選第一張牌吧！</div>
      <button class="confirm-btn" id="confirmBtn" type="button" disabled>確定答案 ✓</button>

    <section class="pk-panel hidden" id="pkPanel" aria-label="雙人PK賽">
      <div class="pk-player" id="pkLeft" data-side="left">
        <div class="pk-head">
          <span class="pk-name">🔵 左方玩家</span>
          <span class="pk-progress">第 <b>1</b>／<span class="pk-total">10</span> 題</span>
          <span class="pk-tries" aria-label="還有三次機會">♥ ♥ ♥</span>
        </div>
        <div class="pk-equation"></div>
        <div class="pk-cards" aria-label="左方數字紙牌區"></div>
        <div class="pk-message" role="status" aria-live="polite">準備開始！</div>
        <button class="pk-confirm" type="button" disabled>確定答案 ✓</button>
      </div>

      <div class="pk-divider" aria-hidden="true"><span>PK</span></div>

      <div class="pk-player" id="pkRight" data-side="right">
        <div class="pk-head">
          <span class="pk-name">🔴 右方玩家</span>
          <span class="pk-progress">第 <b>1</b>／<span class="pk-total">10</span> 題</span>
          <span class="pk-tries" aria-label="還有三次機會">♥ ♥ ♥</span>
        </div>
        <div class="pk-equation"></div>
        <div class="pk-cards" aria-label="右方數字紙牌區"></div>
        <div class="pk-message" role="status" aria-live="polite">準備開始！</div>
        <button class="pk-confirm" type="button" disabled>確定答案 ✓</button>
      </div>

      <div class="pk-countdown hidden" id="pkCountdown" aria-live="assertive">
        <div class="pk-countdown-number">5</div>
      </div>
    </section>
  </main>

  <div class="overlay" id="startOverlay">
    <section class="modal" aria-labelledby="startTitle">
      <div class="modal-icon" aria-hidden="true">🔟</div>
      <h2 id="startTitle">選擇遊戲模式</h2>
      <p>單人版 15 題、PK 賽 10 題、遊戲版 PK 賽 20 題！</p>
      <div class="mode-grid">
        <button class="mode-btn basic" id="basicBtn" type="button">
          <span class="mode-icon" aria-hidden="true">🌱</span>
          <span class="mode-name">基礎版</span>
          <span class="mode-desc">選 2 張牌合成 10</span>
        </button>
        <button class="mode-btn advanced" id="advancedBtn" type="button">
          <span class="mode-icon" aria-hidden="true">🚀</span>
          <span class="mode-name">進階版</span>
          <span class="mode-desc">選 3～7 張牌合成 10</span>
        </button>
        <button class="mode-btn pk-basic" id="basicPkBtn" type="button">
          <span class="mode-icon" aria-hidden="true">⚔️</span>
          <span class="mode-name">基礎版 PK賽</span>
          <span class="mode-desc">左右競速｜選 2 張牌</span>
        </button>
        <button class="mode-btn pk-advanced" id="advancedPkBtn" type="button">
          <span class="mode-icon" aria-hidden="true">🏁</span>
          <span class="mode-name">進階版 PK賽</span>
          <span class="mode-desc">左右競速｜選 3～7 張牌</span>
        </button>
        <button class="mode-btn pk-game" id="gamePkBtn" type="button">
          <span class="mode-icon" aria-hidden="true">🎮</span>
          <span class="mode-name">遊戲版 PK賽</span>
          <span class="mode-desc">左右競速｜20 題找出缺少的數字</span>
        </button>
      </div>
    </section>
  </div>

  <div class="overlay hidden" id="finishOverlay">
    <section class="modal" aria-labelledby="finishTitle">
      <div class="modal-icon" aria-hidden="true">🏆</div>
      <h2 id="finishTitle">全部完成！</h2>
      <p id="finishText"></p>
      <div class="finish-actions">
        <button class="again-btn" id="againBtn" type="button">再玩一次</button>
        <button class="home-btn" id="homeBtn" type="button">回首頁</button>
      </div>
    </section>
  </div>

  <div class="celebrate hidden" id="celebrate" aria-hidden="true"><div class="cheer">答對了！好棒！</div></div>

  <script>
    (() => {
      'use strict';

      const TOTAL = 15;
      const MAX_WRONG = 3;
      const PK_TOTALS = { basic: 10, advanced: 10, game: 20 };
      const palette = [
        ['#ff817c','#d95f64'], ['#5bc5ed','#3495bd'], ['#8b72ed','#684fc4'],
        ['#ffb84f','#da8a27'], ['#50c98a','#2f9f68'], ['#ed72b1','#c64c8c']
      ];

      const cardsEl = document.getElementById('cards');
      const messageEl = document.getElementById('message');
      const equationEl = document.getElementById('equation');
      const triesEl = document.getElementById('tries');
      const scoreEl = document.getElementById('score');
      const questionNoEl = document.getElementById('questionNo');
      const progressBar = document.getElementById('progressBar');
      const nextBtn = document.getElementById('nextBtn');
      const confirmBtn = document.getElementById('confirmBtn');
      const celebrateEl = document.getElementById('celebrate');
      const startOverlay = document.getElementById('startOverlay');
      const finishOverlay = document.getElementById('finishOverlay');
      const finishText = document.getElementById('finishText');
      const subtitleEl = document.getElementById('subtitle');
      const instructionEl = document.getElementById('instruction');
      const appEl = document.querySelector('.app');
      const singlePanel = document.getElementById('singlePanel');
      const pkPanel = document.getElementById('pkPanel');
      const scorePill = document.getElementById('scorePill');
      const pkCountdown = document.getElementById('pkCountdown');
      const pkLeft = document.getElementById('pkLeft');
      const pkRight = document.getElementById('pkRight');

      let question = 1;
      let score = 0;
      let wrongCount = 0;
      let selected = [];
      let deck = [];
      let answerIndices = [];
      let answerHistory = [];
      let locked = true;
      let audioCtx = null;
      let nextTimer = null;
      let lastTouchAt = 0;
      let mode = 'basic';
      let advancedSchedule = [];
      let isPK = false;
      let pkMode = 'basic';
      let pkQuestions = [];
      let pkStates = {};
      let pkRaceOver = false;
      let pkCountdownTimer = null;
      let pkTimers = [];

      function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
      }

      function countTenPairs(values) {
        const pairs = [];
        for (let i = 0; i < values.length; i++) {
          for (let j = i + 1; j < values.length; j++) {
            if (values[i] + values[j] === 10) pairs.push([i, j]);
          }
        }
        return pairs;
      }

      function makeDeck() {
        let candidate, pairs, key;
        let safety = 0;
        do {
          candidate = Array.from({ length: 9 }, () => 1 + Math.floor(Math.random() * 9));
          pairs = countTenPairs(candidate);
          if (pairs.length === 1) {
            const [i, j] = pairs[0];
            key = [candidate[i], candidate[j]].sort((a, b) => a - b).join('+');
          }
          safety++;
        } while (
          pairs.length !== 1 ||
          (answerHistory.length >= 1 && answerHistory.at(-1) === key)
        );
        if (safety > 100000) throw new Error('無法產生題目');
        answerHistory.push(key);
        return { values: candidate, pair: pairs[0] };
      }

      function buildAdvancedSchedule() {
        const all = [];

        function collect(remaining, minimum, parts) {
          if (remaining === 0) {
            if (parts.length >= 3 && parts.length <= 7) all.push([...parts]);
            return;
          }
          if (parts.length >= 7) return;
          for (let value = minimum; value <= 9 && value <= remaining; value++) {
            collect(remaining - value, value, [...parts, value]);
          }
        }

        collect(10, 1, []);
        const chosen = [];

        // 先讓 3、4、5、6、7 張牌的題型都至少出現一次。
        for (let count = 3; count <= 7; count++) {
          const group = all.filter(combo => combo.length === count);
          chosen.push(group[Math.floor(Math.random() * group.length)]);
        }

        const chosenKeys = new Set(chosen.map(combo => combo.join('+')));
        const remaining = shuffle(all.filter(combo => !chosenKeys.has(combo.join('+'))));
        chosen.push(...remaining.slice(0, TOTAL - chosen.length));
        return shuffle(chosen);
      }

      function makeAdvancedDeck(answer) {
        const tagged = answer.map(number => ({ number, answer: true }));
        while (tagged.length < 9) {
          // 每次只加入不會和現有任何紙牌合成 10 的數字。
          // 5 不作為干擾牌，避免兩張 5 組成 10。
          const safeNumbers = [1, 2, 3, 4, 6, 7, 8, 9].filter(number =>
            tagged.every(card => card.number + number !== 10)
          );
          tagged.push({
            number: safeNumbers[Math.floor(Math.random() * safeNumbers.length)],
            answer: false
          });
        }
        shuffle(tagged);
        return {
          values: tagged.map(card => card.number),
          pair: tagged.reduce((indices, card, index) => {
            if (card.answer) indices.push(index);
            return indices;
          }, [])
        };
      }

      function renderQuestion() {
        clearTimeout(nextTimer);
        wrongCount = 0;
        selected = [];
        locked = false;
        nextBtn.classList.remove('show');
        confirmBtn.classList.toggle('show', mode === 'advanced');
        confirmBtn.disabled = true;
        const generated = mode === 'basic'
          ? makeDeck()
          : makeAdvancedDeck(advancedSchedule[question - 1]);
        deck = generated.values;
        answerIndices = generated.pair;
        questionNoEl.textContent = question;
        progressBar.style.width = `${((question - 1) / TOTAL) * 100}%`;
        equationEl.textContent = mode === 'basic' ? '？＋？＝10' : '';
        equationEl.classList.toggle('empty', mode === 'advanced');
        messageEl.textContent = '先選第一張牌吧！';
        updateTries();
        cardsEl.innerHTML = '';

        deck.forEach((number, index) => {
          const button = document.createElement('button');
          const colors = palette[index % palette.length];
          button.type = 'button';
          button.className = 'card';
          button.textContent = number;
          button.dataset.index = index;
          button.style.setProperty('--card-color', colors[0]);
          button.style.setProperty('--card-shadow', colors[1]);
          button.setAttribute('aria-label', `數字 ${number}`);
          button.addEventListener('pointerdown', event => {
            if (event.pointerType === 'touch' || event.pointerType === 'pen') {
              event.preventDefault();
              lastTouchAt = Date.now();
              selectCard(index, button);
            }
          });
          button.addEventListener('click', event => {
            // 觸控後瀏覽器可能補送 click；略過它，避免同一張牌被選取兩次。
            if (event.detail !== 0 && Date.now() - lastTouchAt < 700) return;
            selectCard(index, button);
          });
          cardsEl.appendChild(button);
        });
      }

      function selectCard(index, button) {
        if (locked) return;
        speakNumber(deck[index]);
        if (selected.includes(index)) {
          selected = selected.filter(i => i !== index);
          button.classList.remove('selected');
          updateEquation();
          updateConfirmButton();
          messageEl.textContent = '換一張牌也可以！';
          playTone(330, .09, 'sine', .14);
          return;
        }
        if (mode === 'advanced' && selected.length >= 7) {
          messageEl.textContent = '最多選 7 張牌，請先取消一張！';
          playWrong();
          return;
        }
        selected.push(index);
        button.classList.add('selected');
        playTone(520, .09, 'sine', .16);
        if (selected.length === 1) {
          updateEquation();
          messageEl.textContent = mode === 'basic' ? '再選第二張牌！' : '請繼續選牌！';
        } else if (mode === 'basic') {
          checkAnswer();
        } else {
          updateEquation();
          updateConfirmButton();
          if (selected.length < 3) {
            messageEl.textContent = `至少再選 ${3 - selected.length} 張牌！`;
          } else {
            messageEl.textContent = `已選 ${selected.length} 張，選好後按「確定答案」！`;
          }
        }
      }

      function updateEquation() {
        if (selected.length === 0) {
          equationEl.textContent = mode === 'basic' ? '？＋？＝10' : '';
          equationEl.classList.toggle('empty', mode === 'advanced');
          return;
        }
        equationEl.classList.remove('empty');
        const values = selected.map(i => deck[i]);
        if (mode === 'advanced') {
          equationEl.textContent = `${values.join('＋')}＝？`;
          return;
        }
        const total = values.reduce((sum, value) => sum + value, 0);
        equationEl.textContent = values.length === 1
          ? `${values[0]}＋？＝10`
          : `${values.join('＋')}＝${total}`;
      }

      function updateConfirmButton() {
        confirmBtn.disabled = mode !== 'advanced' || locked || selected.length < 3 || selected.length > 7;
      }

      function checkAnswer() {
        locked = true;
        confirmBtn.disabled = true;
        const values = selected.map(i => deck[i]);
        const total = values.reduce((sum, value) => sum + value, 0);
        equationEl.textContent = mode === 'advanced'
          ? `${values.join('＋')}＝？`
          : `${values.join('＋')}＝${total}`;
        const correct = mode === 'basic'
          ? selected.length === 2 && total === 10
          : selected.length >= 3 && selected.length <= 7 && total === 10;
        if (correct) {
          score++;
          scoreEl.textContent = score;
          messageEl.textContent = '答對了！好棒！';
          selected.forEach(i => cardsEl.children[i].classList.add('correct'));
          playSuccess();
          showCelebration();
          nextTimer = setTimeout(nextQuestion, 1450);
        } else {
          wrongCount++;
          selected.forEach(i => cardsEl.children[i].classList.add('wrong'));
          playWrong();
          updateTries();
          if (wrongCount >= MAX_WRONG) {
            answerIndices.forEach(i => cardsEl.children[i].classList.add('correct'));
            disableCards();
            const answerValues = answerIndices.map(i => deck[i]);
            equationEl.textContent = `${answerValues.join('＋')}＝10`;
            messageEl.textContent = `正確答案是 ${answerValues.join('、')}，記住它們喔！`;
            nextBtn.classList.add('show');
            nextTimer = setTimeout(nextQuestion, 3600);
          } else {
            const left = MAX_WRONG - wrongCount;
            messageEl.textContent = `再想一想，還有 ${left} 次機會！`;
            setTimeout(() => {
              selected.forEach(i => cardsEl.children[i].classList.remove('selected', 'wrong'));
              selected = [];
              updateEquation();
              locked = false;
              updateConfirmButton();
            }, 750);
          }
        }
      }

      function submitAdvancedAnswer() {
        if (mode !== 'advanced' || locked) return;
        if (selected.length < 3 || selected.length > 7) {
          messageEl.textContent = '請選擇 3～7 張牌後再按確定！';
          playWrong();
          return;
        }
        checkAnswer();
      }

      function updateTries() {
        const left = MAX_WRONG - wrongCount;
        triesEl.textContent = `${'♥ '.repeat(left)}${'♡ '.repeat(MAX_WRONG - left)}`.trim();
        triesEl.setAttribute('aria-label', `還有 ${left} 次機會`);
      }

      function disableCards() {
        [...cardsEl.children].forEach(card => { card.disabled = true; });
      }

      function nextQuestion() {
        if (!locked && wrongCount < MAX_WRONG) return;
        clearTimeout(nextTimer);
        nextBtn.classList.remove('show');
        if (question >= TOTAL) {
          finishGame();
        } else {
          question++;
          renderQuestion();
        }
      }

      function showCelebration() {
        celebrateEl.querySelectorAll('.confetti').forEach(el => el.remove());
        const colors = ['#ff6775','#ffd33d','#59c8ef','#62d792','#a37cf1'];
        for (let i = 0; i < 34; i++) {
          const bit = document.createElement('i');
          bit.className = 'confetti';
          bit.style.setProperty('--x', `${Math.random() * 100}%`);
          bit.style.setProperty('--c', colors[i % colors.length]);
          bit.style.setProperty('--r', `${Math.random() * 180}deg`);
          bit.style.setProperty('--d', `${.8 + Math.random() * .8}s`);
          celebrateEl.appendChild(bit);
        }
        celebrateEl.classList.remove('hidden');
        setTimeout(() => celebrateEl.classList.add('hidden'), 1250);
      }

      function ensureAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
      }

      function speakNumber(number) {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const speech = new SpeechSynthesisUtterance(String(number));
        speech.lang = 'zh-TW';
        speech.rate = .78;
        speech.pitch = 1.12;
        speech.volume = 1;
        window.speechSynthesis.speak(speech);
      }

      function playTone(freq, duration, type = 'sine', volume = .06, delay = 0) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(volume, audioCtx.currentTime + delay);
        gain.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime + delay + duration);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + delay);
        osc.stop(audioCtx.currentTime + delay + duration);
      }

      function playSuccess() {
        playTone(523, .2, 'triangle', .24, 0);
        playTone(659, .2, 'triangle', .24, .13);
        playTone(784, .3, 'triangle', .27, .26);
      }

      function playWrong() {
        playTone(230, .18, 'sawtooth', .15, 0);
        playTone(180, .22, 'sawtooth', .13, .12);
      }

      function addPKTimer(callback, delay) {
        const timer = setTimeout(() => {
          pkTimers = pkTimers.filter(item => item !== timer);
          callback();
        }, delay);
        pkTimers.push(timer);
        return timer;
      }

      function clearPKTimers() {
        clearInterval(pkCountdownTimer);
        pkCountdownTimer = null;
        pkTimers.forEach(clearTimeout);
        pkTimers = [];
      }

      function getPKPlayer(side) {
        return side === 'left' ? pkLeft : pkRight;
      }

      function buildGamePKSchedule(blockedSchedule = []) {
        const schedule = [];
        const numbers = Array.from({ length: 9 }, (_, index) => index + 1);
        while (schedule.length < PK_TOTALS.game) {
          const recentPrompts = schedule.slice(-3).map(item => item.prompt);
          const blockedPrompt = blockedSchedule[schedule.length]?.prompt;
          const choices = numbers.filter(number =>
            !recentPrompts.includes(number) && number !== blockedPrompt
          );
          const prompt = choices[Math.floor(Math.random() * choices.length)];
          schedule.push({
            prompt,
            answer: 10 - prompt,
            values: [...numbers],
            pair: [9 - prompt]
          });
        }
        return schedule;
      }

      function buildPKQuestions(selectedMode) {
        if (selectedMode === 'game') return buildGamePKSchedule();
        if (selectedMode === 'basic') {
          answerHistory = [];
          return Array.from({ length: 10 }, () => {
            const generated = makeDeck();
            return { values: [...generated.values], pair: [...generated.pair] };
          });
        }
        return buildAdvancedSchedule().slice(0, 10).map(answer => {
          const generated = makeAdvancedDeck(answer);
          return { values: [...generated.values], pair: [...generated.pair] };
        });
      }

      function pkAnswerKey(questionData) {
        if (typeof questionData.prompt === 'number') return `${questionData.prompt}+${questionData.answer}`;
        return questionData.pair
          .map(index => questionData.values[index])
          .sort((a, b) => a - b)
          .join('+');
      }

      function updatePKTries(side) {
        const state = pkStates[side];
        const tries = getPKPlayer(side).querySelector('.pk-tries');
        const left = MAX_WRONG - state.wrong;
        tries.textContent = `${'♥ '.repeat(left)}${'♡ '.repeat(MAX_WRONG - left)}`.trim();
        tries.setAttribute('aria-label', `還有 ${left} 次機會`);
      }

      function updatePKEquation(side) {
        const state = pkStates[side];
        const player = getPKPlayer(side);
        const equation = player.querySelector('.pk-equation');
        const questionData = pkQuestions[side][state.question];
        equation.classList.toggle('game-question', pkMode === 'game');
        if (pkMode === 'game') {
          if (state.selected.length === 0) {
            equation.innerHTML = `<span class="game-question-line">${questionData.prompt}＋<span class="game-missing">？</span>＝10</span>`;
          } else {
            const selectedValue = questionData.values[state.selected[0]];
            equation.textContent = `${questionData.prompt}＋${selectedValue}＝${questionData.prompt + selectedValue}`;
          }
          equation.classList.remove('empty');
          return;
        }
        if (state.selected.length === 0) {
          equation.textContent = pkMode === 'basic' ? '？＋？＝10' : '';
          equation.classList.toggle('empty', pkMode === 'advanced');
          return;
        }
        equation.classList.remove('empty');
        const values = state.selected.map(index => pkQuestions[side][state.question].values[index]);
        if (pkMode === 'advanced') {
          equation.textContent = `${values.join('＋')}＝？`;
        } else {
          const total = values.reduce((sum, value) => sum + value, 0);
          equation.textContent = values.length === 1
            ? `${values[0]}＋？＝10`
            : `${values.join('＋')}＝${total}`;
        }
      }

      function updatePKConfirm(side) {
        const state = pkStates[side];
        const confirm = getPKPlayer(side).querySelector('.pk-confirm');
        confirm.disabled = pkMode !== 'advanced' || state.locked || pkRaceOver ||
          state.selected.length < 3 || state.selected.length > 7;
      }

      function renderPKSide(side, keepLocked = false) {
        const state = pkStates[side];
        const player = getPKPlayer(side);
        const questionData = pkQuestions[side][state.question];
        state.wrong = 0;
        state.selected = [];
        state.locked = keepLocked || pkRaceOver;
        state.lastTouchAt = 0;
        player.querySelector('.pk-progress b').textContent = state.question + 1;
        player.querySelector('.pk-message').textContent = keepLocked
          ? '準備開始！'
          : (pkMode === 'game' ? '請選出缺少的數字！' : '先選第一張牌吧！');
        const equation = player.querySelector('.pk-equation');
        equation.classList.toggle('game-question', pkMode === 'game');
        if (pkMode === 'game') {
          equation.innerHTML = `<span class="game-question-line">${questionData.prompt}＋<span class="game-missing">？</span>＝10</span>`;
        } else {
          equation.textContent = pkMode === 'basic' ? '？＋？＝10' : '';
        }
        equation.classList.toggle('empty', pkMode === 'advanced');
        const confirm = player.querySelector('.pk-confirm');
        confirm.classList.toggle('show', pkMode === 'advanced');
        confirm.disabled = true;
        updatePKTries(side);

        const cards = player.querySelector('.pk-cards');
        cards.innerHTML = '';
        questionData.values.forEach((number, index) => {
          const button = document.createElement('button');
          const colors = palette[index % palette.length];
          button.type = 'button';
          button.className = 'pk-card';
          button.textContent = number;
          button.style.setProperty('--card-color', colors[0]);
          button.style.setProperty('--card-shadow', colors[1]);
          button.setAttribute('aria-label', `數字 ${number}`);
          button.addEventListener('pointerdown', event => {
            if (event.pointerType === 'touch' || event.pointerType === 'pen') {
              event.preventDefault();
              state.lastTouchAt = Date.now();
              selectPKCard(side, index, button);
            }
          });
          button.addEventListener('click', event => {
            if (event.detail !== 0 && Date.now() - state.lastTouchAt < 700) return;
            selectPKCard(side, index, button);
          });
          cards.appendChild(button);
        });
      }

      function selectPKCard(side, index, button) {
        const state = pkStates[side];
        if (!state || state.locked || pkRaceOver) return;
        const number = pkQuestions[side][state.question].values[index];
        speakNumber(number);
        if (pkMode === 'game') {
          state.selected = [index];
          button.classList.add('selected');
          playTone(520, .09, 'sine', .16);
          updatePKEquation(side);
          checkPKAnswer(side);
          return;
        }
        if (state.selected.includes(index)) {
          state.selected = state.selected.filter(item => item !== index);
          button.classList.remove('selected');
          updatePKEquation(side);
          updatePKConfirm(side);
          getPKPlayer(side).querySelector('.pk-message').textContent = '換一張牌也可以！';
          playTone(330, .09, 'sine', .14);
          return;
        }
        if (pkMode === 'advanced' && state.selected.length >= 7) {
          getPKPlayer(side).querySelector('.pk-message').textContent = '最多選 7 張牌！';
          playWrong();
          return;
        }
        state.selected.push(index);
        button.classList.add('selected');
        playTone(520, .09, 'sine', .16);
        updatePKEquation(side);
        if (pkMode === 'basic' && state.selected.length === 2) {
          checkPKAnswer(side);
          return;
        }
        if (pkMode === 'basic') {
          getPKPlayer(side).querySelector('.pk-message').textContent = '再選第二張牌！';
        } else {
          updatePKConfirm(side);
          getPKPlayer(side).querySelector('.pk-message').textContent = state.selected.length < 3
            ? `至少再選 ${3 - state.selected.length} 張牌！`
            : `已選 ${state.selected.length} 張，請按確定！`;
        }
      }

      function checkPKAnswer(side) {
        const state = pkStates[side];
        if (!state || state.locked || pkRaceOver) return;
        if (pkMode === 'advanced' && (state.selected.length < 3 || state.selected.length > 7)) {
          getPKPlayer(side).querySelector('.pk-message').textContent = '請選擇 3～7 張牌！';
          playWrong();
          return;
        }
        state.locked = true;
        updatePKConfirm(side);
        const player = getPKPlayer(side);
        const cards = player.querySelector('.pk-cards');
        const questionData = pkQuestions[side][state.question];
        const values = state.selected.map(index => questionData.values[index]);
        const total = values.reduce((sum, value) => sum + value, 0);
        if (pkMode === 'basic') player.querySelector('.pk-equation').textContent = `${values.join('＋')}＝${total}`;
        const correct = pkMode === 'game'
          ? state.selected.length === 1 && values[0] === questionData.answer
          : (pkMode === 'basic'
              ? state.selected.length === 2 && total === 10
              : state.selected.length >= 3 && state.selected.length <= 7 && total === 10);

        if (correct) {
          state.selected.forEach(index => cards.children[index].classList.add('correct'));
          player.querySelector('.pk-message').textContent = '答對了！下一題！';
          playSuccess();
          addPKTimer(() => advancePK(side), 700);
          return;
        }

        state.wrong++;
        state.selected.forEach(index => cards.children[index].classList.add('wrong'));
        updatePKTries(side);
        playWrong();
        if (state.wrong >= MAX_WRONG) {
          player.querySelector('.pk-message').textContent = '再試一次，答對才能進入下一題！';
          addPKTimer(() => {
            if (pkRaceOver) return;
            [...cards.children].forEach(card => {
              card.disabled = false;
              card.classList.remove('selected', 'wrong');
            });
            state.selected = [];
            state.wrong = 0;
            state.locked = false;
            updatePKTries(side);
            updatePKEquation(side);
            updatePKConfirm(side);
            player.querySelector('.pk-message').textContent = '請重新選牌！';
          }, 750);
        } else {
          player.querySelector('.pk-message').textContent = `再想一想，還有 ${MAX_WRONG - state.wrong} 次！`;
          addPKTimer(() => {
            if (pkRaceOver) return;
            state.selected.forEach(index => cards.children[index].classList.remove('selected', 'wrong'));
            state.selected = [];
            state.locked = false;
            updatePKEquation(side);
            updatePKConfirm(side);
          }, 600);
        }
      }

      function advancePK(side) {
        if (pkRaceOver) return;
        const state = pkStates[side];
        state.question++;
        if (state.question >= PK_TOTALS[pkMode]) {
          finishPK(side);
        } else {
          renderPKSide(side);
        }
      }

      function finishPK(winnerSide) {
        if (pkRaceOver) return;
        pkRaceOver = true;
        const loserSide = winnerSide === 'left' ? 'right' : 'left';
        Object.values(pkStates).forEach(state => { state.locked = true; });
        [pkLeft, pkRight].forEach(player => {
          player.querySelectorAll('button').forEach(button => { button.disabled = true; });
        });
        const winner = getPKPlayer(winnerSide);
        const loser = getPKPlayer(loserSide);
        winner.classList.add('winner');
        loser.classList.add('loser');
        const banner = document.createElement('div');
        banner.className = 'pk-winner-card';
        banner.textContent = '🏆 獲勝！';
        winner.appendChild(banner);
        winner.querySelector('.pk-message').textContent = `恭喜你先完成 ${PK_TOTALS[pkMode]} 題！`;
        loser.querySelector('.pk-message').textContent = '比賽結束';
        celebrateEl.querySelector('.cheer').textContent = `${winnerSide === 'left' ? '左方' : '右方'}獲勝！好棒！`;
        showCelebration();
        playSuccess();
      }

      function startPK(selectedMode) {
        ensureAudio();
        clearTimeout(nextTimer);
        clearPKTimers();
        isPK = true;
        pkMode = selectedMode;
        mode = selectedMode;
        pkRaceOver = false;
        const leftQuestions = buildPKQuestions(selectedMode);
        let rightQuestions;
        let attempts = 0;
        if (selectedMode === 'game') {
          rightQuestions = buildGamePKSchedule(leftQuestions);
        } else {
          do {
            rightQuestions = buildPKQuestions(selectedMode);
            attempts++;
          } while (
            attempts < 200 &&
            rightQuestions.some((item, index) => pkAnswerKey(item) === pkAnswerKey(leftQuestions[index]))
          );
        }
        pkQuestions = { left: leftQuestions, right: rightQuestions };
        pkStates = {
          left: { question: 0, wrong: 0, selected: [], locked: true, lastTouchAt: 0 },
          right: { question: 0, wrong: 0, selected: [], locked: true, lastTouchAt: 0 }
        };
        [pkLeft, pkRight].forEach(player => {
          player.classList.remove('winner', 'loser');
          player.querySelectorAll('.pk-winner-card').forEach(item => item.remove());
        });
        singlePanel.classList.add('hidden');
        pkPanel.classList.remove('hidden');
        appEl.classList.add('pk-active');
        scorePill.classList.add('hidden');
        startOverlay.classList.add('hidden');
        finishOverlay.classList.add('hidden');
        subtitleEl.textContent = selectedMode === 'basic'
          ? '基礎版 PK賽｜左右各選兩張牌合成 10！'
          : (selectedMode === 'advanced'
              ? '進階版 PK賽｜左右各選 3～7 張牌合成 10！'
              : '遊戲版 PK賽｜從九宮格找出缺少的數字！');
        document.querySelectorAll('.pk-total').forEach(item => {
          item.textContent = PK_TOTALS[selectedMode];
        });
        renderPKSide('left', true);
        renderPKSide('right', true);

        let count = 5;
        const number = pkCountdown.querySelector('.pk-countdown-number');
        number.classList.remove('start');
        number.textContent = count;
        pkCountdown.classList.remove('hidden');
        pkCountdownTimer = setInterval(() => {
          count--;
          number.classList.remove('pop');
          void number.offsetWidth;
          number.classList.add('pop');
          if (count > 0) {
            number.textContent = count;
            playTone(440, .12, 'sine', .2);
          } else {
            clearInterval(pkCountdownTimer);
            pkCountdownTimer = null;
            number.textContent = '開始';
            number.classList.add('start');
            playSuccess();
            addPKTimer(() => {
              pkCountdown.classList.add('hidden');
              if (!isPK || pkRaceOver) return;
              pkStates.left.locked = false;
              pkStates.right.locked = false;
              const startMessage = selectedMode === 'game' ? '請選出缺少的數字！' : '先選第一張牌吧！';
              pkLeft.querySelector('.pk-message').textContent = startMessage;
              pkRight.querySelector('.pk-message').textContent = startMessage;
              updatePKConfirm('left');
              updatePKConfirm('right');
            }, 600);
          }
        }, 1000);
      }

      function startGame(selectedMode = mode) {
        ensureAudio();
        clearTimeout(nextTimer);
        clearPKTimers();
        isPK = false;
        pkRaceOver = false;
        appEl.classList.remove('pk-active');
        singlePanel.classList.remove('hidden');
        pkPanel.classList.add('hidden');
        scorePill.classList.remove('hidden');
        celebrateEl.querySelector('.cheer').textContent = '答對了！好棒！';
        mode = selectedMode;
        question = 1;
        score = 0;
        answerHistory = [];
        advancedSchedule = mode === 'advanced' ? buildAdvancedSchedule() : [];
        scoreEl.textContent = '0';
        subtitleEl.textContent = mode === 'basic'
          ? '基礎版｜找出兩張相加等於 10 的牌！'
          : '進階版｜找出 3～7 張相加等於 10 的牌！';
        instructionEl.textContent = mode === 'basic'
          ? '請點選兩張牌，合起來要等於 10'
          : '請點選 3～7 張牌，再按「確定答案」';
        startOverlay.classList.add('hidden');
        finishOverlay.classList.add('hidden');
        renderQuestion();
      }

      function showHome() {
        clearTimeout(nextTimer);
        clearPKTimers();
        isPK = false;
        pkRaceOver = false;
        appEl.classList.remove('pk-active');
        locked = true;
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        pkCountdown.classList.add('hidden');
        pkPanel.classList.add('hidden');
        singlePanel.classList.remove('hidden');
        scorePill.classList.remove('hidden');
        [pkLeft, pkRight].forEach(player => {
          player.classList.remove('winner', 'loser');
          player.querySelectorAll('.pk-winner-card').forEach(item => item.remove());
        });
        celebrateEl.classList.add('hidden');
        celebrateEl.querySelector('.cheer').textContent = '答對了！好棒！';
        finishOverlay.classList.add('hidden');
        startOverlay.classList.remove('hidden');
      }

      function finishGame() {
        locked = true;
        progressBar.style.width = '100%';
        finishText.innerHTML = `你完成了 15 題，答對 <strong>${score}</strong> 題！<br>${score >= 12 ? '你是合成 10 小高手！' : '再玩一次，就會越來越厲害！'}`;
        finishOverlay.classList.remove('hidden');
        playSuccess();
      }

      document.getElementById('basicBtn').addEventListener('click', () => startGame('basic'));
      document.getElementById('advancedBtn').addEventListener('click', () => startGame('advanced'));
      document.getElementById('basicPkBtn').addEventListener('click', () => startPK('basic'));
      document.getElementById('advancedPkBtn').addEventListener('click', () => startPK('advanced'));
      document.getElementById('gamePkBtn').addEventListener('click', () => startPK('game'));
      document.getElementById('againBtn').addEventListener('click', () => startGame(mode));
      document.getElementById('homeBtn').addEventListener('click', showHome);
      document.getElementById('topHomeBtn').addEventListener('click', showHome);
      confirmBtn.addEventListener('click', submitAdvancedAnswer);
      nextBtn.addEventListener('click', nextQuestion);
      pkLeft.querySelector('.pk-confirm').addEventListener('click', () => checkPKAnswer('left'));
      pkRight.querySelector('.pk-confirm').addEventListener('click', () => checkPKAnswer('right'));

      // 先放置一組牌，開始前畫面後方不會空白。
      const preview = makeDeck();
      deck = preview.values;
      answerIndices = preview.pair;
      renderQuestion();
      locked = true;
    })();
  </script>
</body>
</html>
